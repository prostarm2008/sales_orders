<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .error-container {
            text-align: center; background: var(--card-bg); padding: 60px 44px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); max-width: 440px; border: 1px solid var(--border); position: relative; overflow: hidden;
        }
        .error-container::before {
            content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(30,79,214,0.12) 0%, transparent 70%);
        }
        .error-container::after {
            content: ''; position: absolute; bottom: -50px; left: -50px; width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,90,54,0.10) 0%, transparent 70%);
        }
        .error-code { font-size: 78px; font-weight: 800; background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; line-height: 1; position: relative; }
        .error-title { font-size: 22px; font-weight: 700; margin: 18px 0 8px 0; position: relative; }
        .error-message { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; position: relative; }
        .logo-fallback { width: 48px; height: 48px; background: var(--primary-grad); color: white; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin: 0 auto 24px auto; }
    </style>
</head>
<body>

<div class="error-container">
    <img src="Prostarm-logo.png" alt="Prostarm" style="height: 38px; margin-bottom: 24px; position:relative;" onerror="this.outerHTML='<div class=\'logo-fallback\'>PR</div>';">

    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <div class="error-message">We couldn't find the page you were looking for. It might have been moved, deleted, or perhaps the URL was mistyped.</div>

    <a href="dashboard.html" class="btn btn-submit">Return to Dashboard</a>
</div>

</body>
</html>
