<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:var(--ink)}
.error-container{text-align:center;background:#fff;padding:56px 44px;border-radius:20px;box-shadow:var(--shadow-lg);max-width:440px;border-top:6px solid var(--power)}
.error-code{font-size:84px;font-weight:800;background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0;line-height:1}
.error-title{font-size:22px;font-weight:800;margin:16px 0 8px}
.error-message{color:var(--text-muted);font-size:15px;margin-bottom:28px;line-height:1.6}
.logo-fallback{width:48px;height:48px;background:var(--primary-grad);color:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin:0 auto 24px}
</style>
</head>
<body>

<div class="error-container">
    <img src="Prostarm-logo.png" alt="Prostarm" style="height: 38px; margin-bottom: 24px; position:relative;" onerror="this.outerHTML='<div class=\'logo-fallback\'>PR</div>';">

    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <div class="error-message">We couldn't find the page you were looking for. It might have been moved, deleted, or perhaps the URL was mistyped.</div>

    <a href="dashboard.html" class="btn btn-submit">Return to Dashboard</a>
</div>

</body>
</html>
