<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
.main-content{max-width:760px;margin:0 auto}
.page-header{margin-bottom:24px}.page-header h1{margin:0;font-size:26px}
.settings-card{background:var(--card-bg);padding:28px;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:20px;border-left:4px solid var(--primary)}
.settings-card h3{margin:0 0 20px;font-size:17px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:700;margin-bottom:7px;font-size:13px;color:var(--text-muted)}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.form-group input[readonly]{background:var(--card-bg-alt);color:var(--text-muted);cursor:not-allowed}
.btn-save{background:var(--primary-grad);color:#fff;padding:12px 26px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s var(--ease);box-shadow:var(--shadow-glow)}
.btn-save:hover{transform:translateY(-2px)}
</style>
</head>
<body class="has-sidebar">
<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
<div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
<aside class="app-sidebar">
    <div class="sidebar-brand">
        <img src="Prostarm-logo.png" alt="Prostarm" onerror="this.outerHTML='<div style=\'font-weight:800; color:#1e4fd6; font-size:15px;\'>PROSTARM</div>';">
    </div>
    <nav class="sidebar-nav">
        <div class="sidebar-section-label">Workspace</div>
            <a href="dashboard.html" class="sidebar-link" data-roles="User,Manager"><span class="sidebar-icon">📊</span>Dashboard</a>    
            <a href="Index.html" class="sidebar-link" data-roles="User,Manager"><span class="sidebar-icon">📝</span>Sales Order Entry</a>
            <a href="manager-analytics-dashboard.html" class="sidebar-link" data-roles="Manager"><span class="sidebar-icon">📈</span>Manager Analytics</a>
            <a href="grid-queue.html" class="sidebar-link" data-roles="Manager"><span class="sidebar-icon">🗂️</span>Grid Queue</a>
            <a href="kanban-queue.html" class="sidebar-link" data-roles="Manager"><span class="sidebar-icon">🗃️</span>Kanban Board</a>
            <a href="settings.html" class="sidebar-link active" data-roles="Manager"><span class="sidebar-icon">⚙️</span>Settings</a>
        <a href="#" class="sidebar-link sidebar-logout" onclick="logout(); return false;"><span class="sidebar-icon">🚪</span>Sign Out</a>
    </nav>
    <div class="sidebar-footer">
        Prostarm CRM &middot; Power Redefined
    </div>
</aside>


<div class="main-content">
    <div class="page-header">
        <h1>Profile & Settings</h1>
    </div>

    <div class="settings-card">
        <h3>Corporate Identity</h3>
        <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="prof-name" readonly>
        </div>
        <div class="form-group">
            <label>Corporate Email ID</label>
            <input type="email" id="prof-email" readonly>
        </div>
        <div class="form-group">
            <label>Role / Access Level</label>
            <input type="text" id="prof-level" readonly>
        </div>
    </div>

    <div class="settings-card">
        <h3>Application Preferences</h3>
        <div class="form-group">
            <label>Default Currency Formatting</label>
            <select id="pref-currency">
                <option value="INR">Indian Rupee (₹)</option>
                <option value="USD">US Dollar ($)</option>
                <option value="EUR">Euro (€)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Default Dispatch Mode</label>
            <select id="pref-dispatch">
                <option value="Delivery">Delivery</option>
                <option value="Self Pickup">Self Pickup</option>
            </select>
        </div>
    </div>

    <div style="text-align: right;">
        <button class="btn-save" onclick="saveSettings()">Save Preferences</button>
    </div>
</div>

<script>
    window.onload = async function() {
        const user = sessionStorage.getItem('loggedInUser');
        const email = sessionStorage.getItem('loggedInEmail');
        
        if (!user) { window.location.href = 'login.html'; return; }
        if (!enforcePageAccess()) return;
        applySidebarAccess();
        
        document.getElementById('prof-name').value = user;
        document.getElementById('prof-email').value = email || "Not Provided";
        document.getElementById('prof-level').value = getUserLevel();

        const savedCurrency = await idbGet('prefCurrency');
        const savedDispatch = await idbGet('prefDispatch');

        if(savedCurrency) document.getElementById('pref-currency').value = savedCurrency;
        if(savedDispatch) document.getElementById('pref-dispatch').value = savedDispatch;
    };

    async function saveSettings() {
        const btn = document.querySelector('.btn-save');
        await idbSet('prefCurrency', document.getElementById('pref-currency').value);
        await idbSet('prefDispatch', document.getElementById('pref-dispatch').value);

        btn.innerText = "Saved ✓";
        btn.style.background = "#16a34a"; 
        
        setTimeout(() => {
            btn.innerText = "Save Preferences";
            btn.style.backgroundColor = "";
        }, 2000);
    }
</script>
<script src="utils.js"></script>
</body>
</html>
