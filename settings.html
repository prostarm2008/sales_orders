<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
        .main-content { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .page-header { margin-bottom: 32px; border-bottom: 2px solid var(--border); padding-bottom: 16px;}
        .page-header h1 { margin: 0 0 8px 0; font-size: 28px; }
        
        .settings-card { background: var(--card-bg); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 24px; transition: box-shadow 0.25s var(--ease);}
        .settings-card:hover { box-shadow: var(--shadow-md); }
        .settings-card h3 { margin: 0 0 24px 0; font-size: 18px; color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        .form-group input[readonly] { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9;}
        .toggle-row:last-child { border-bottom: none; }
        .toggle-label { font-weight: 500; font-size: 14px; }
        
        .btn-save { background: var(--primary-grad); color: white; padding: 13px 26px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s var(--ease); box-shadow: var(--shadow-glow);}
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -6px rgba(37,99,235,0.4); }
    </style>
</head>
<body>

<div class="master-nav">
    <div class="brand-container">
        <img src="Prostarm-logo.png" alt="Prostarm" onerror="this.outerHTML='<div style=\'font-weight:bold; color:#2563eb;\'>PR</div>';">
        <h2 style="margin: 0; font-size: 20px;">Settings</h2>
    </div>
    <div class="master-nav-actions">
        <a href="dashboard.html" class="btn btn-back">← Back to Dashboard</a>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Profile & Settings</h1>
    </div>

    <div class="settings-card">
        <h3>Corporate Identity</h3>
        <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="prof-name" readonly>
        </div>
        <div class="form-group">
            <label>Corporate Email ID</label>
            <input type="email" id="prof-email" readonly>
        </div>
        <div class="form-group">
            <label>Role / Access Level</label>
            <input type="text" value="Sales Representative (Standard)" readonly>
        </div>
    </div>

    <div class="settings-card">
        <h3>Application Preferences</h3>
        <div class="form-group">
            <label>Default Currency Formatting</label>
            <select id="pref-currency">
                <option value="INR">Indian Rupee (₹)</option>
                <option value="USD">US Dollar ($)</option>
                <option value="EUR">Euro (€)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Default Dispatch Mode</label>
            <select id="pref-dispatch">
                <option value="Delivery">Delivery</option>
                <option value="Self Pickup">Self Pickup</option>
            </select>
        </div>
    </div>

    <div style="text-align: right;">
        <button class="btn-save" onclick="saveSettings()">Save Preferences</button>
    </div>
</div>

<script>
    window.onload = function() {
        const user = sessionStorage.getItem('loggedInUser');
        const email = sessionStorage.getItem('loggedInEmail');
        
        if (!user) { window.location.href = 'login.html'; return; }
        
        document.getElementById('prof-name').value = user;
        document.getElementById('prof-email').value = email || "Not Provided";

        const savedCurrency = localStorage.getItem('prefCurrency');
        const savedDispatch = localStorage.getItem('prefDispatch');

        if(savedCurrency) document.getElementById('pref-currency').value = savedCurrency;
        if(savedDispatch) document.getElementById('pref-dispatch').value = savedDispatch;
    };

    function saveSettings() {
        const btn = document.querySelector('.btn-save');
        localStorage.setItem('prefCurrency', document.getElementById('pref-currency').value);
        localStorage.setItem('prefDispatch', document.getElementById('pref-dispatch').value);

        btn.innerText = "Saved ✓";
        btn.style.backgroundColor = "#10b981"; 
        
        setTimeout(() => {
            btn.innerText = "Save Preferences";
            btn.style.backgroundColor = "var(--primary)";
        }, 2000);
    }
</script>
<script src="utils.js"></script>
</body>
</html>
