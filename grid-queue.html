<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Onboarding Team - Grid Queue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
        .grid-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* Stats Header */
        .stats-bar { display: flex; gap: 20px; padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .stat-item span { color: var(--text-main); background: #e2e8f0; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }
        
        .uid-badge { font-weight: 700; color: var(--primary); }
        
        /* Inline Status Dropdown */
        .status-select { 
            padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 2px solid transparent; cursor: pointer; outline: none; transition: 0.2s;
            appearance: none; -webkit-appearance: none;
        }
        .status-select:hover { border-color: #cbd5e1; }
        
        /* Status Colors */
        .status-draft { background: #f1f5f9; color: #475569; }
        .status-submitted { background: #e4eaff; color: #173e9e; }
        .status-approved { background: #dcf7e3; color: #15803d; }
        .status-rejected { background: #fbd9d9; color: #9f1d1d; }
    </style>
</head>

<div class="grid-container">
    <div id="syncBanner" class="sync-banner warn" style="margin: 16px 16px 0 16px;">
        <span id="syncIcon">⚠️</span>
        <span id="syncMainText">Showing locally cached data — live sync with Power Automate failed.</span>
        <span class="sync-detail" id="syncDetail"></span>
    </div>
    <div class="stats-bar" id="statsBar">
        </div>
    <table id="queueTable">
        <thead>
            <tr>
                <th>UID</th>
                <th>Customer Details</th>
                <th>Order Info</th>
                <th>PO Amount</th>
                <th>Sales Rep</th>
                <th>Current Status</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    let ordersData = [];
    const powerAutomateUpdateUrl = "https://8549b42c711be8948675eefb5cf215.dd.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/939bec4d95ba4d5983187f8b75b034e0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=B7UyGivjIHH-8dltPNOUXTz0Kj2mbXN-Tdqr2JE_sOo"; 
    const powerAutomateViewUrl = "https://8549b42c711be8948675eefb5cf215.dd.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/b32de4d56db94337b471df29b82c38e2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=RnRU6dAnci3wp9PMYaajaskcqd6aL0K9fn7-STxchIw";

    function loadCachedOrders() {
        try { return JSON.parse(localStorage.getItem('crmOrders')) || []; } catch(e) { return []; }
    }

    async function loadOrders() {
        // 1) Show cached data immediately instead of leaving the grid blank
        //    while the Power Automate flow is still spinning up.
        ordersData = loadCachedOrders();
        const hadCache = ordersData.length > 0;
        if (hadCache) {
            renderGrid();
            showSyncBanner({ message: 'REFRESHING_CACHE' });
        }

        if (!powerAutomateViewUrl) return;

        // 2) Fetch live data in the background with a timeout, so a slow flow
        //    doesn't leave the user staring at a spinner indefinitely.
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000); // 20s cap

        try {
            const response = await fetch(powerAutomateViewUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) {
                const bodyText = await response.text().catch(() => '');
                throw new Error(`HTTP ${response.status} ${response.statusText}${bodyText ? ' — ' + bodyText.slice(0, 200) : ''}`);
            }
            const bodyText = await response.text();
            if (!bodyText.trim()) {
                throw new Error('EMPTY_BODY');
            }
            let data;
            try {
                data = JSON.parse(bodyText);
            } catch (parseErr) {
                throw new Error(`Flow returned non-JSON content: ${bodyText.slice(0, 200)}`);
            }
            ordersData = Array.isArray(data) ? data : (data.value || []);
            localStorage.setItem('crmOrders', JSON.stringify(ordersData));
            hideSyncBanner();
        } catch (err) {
            clearTimeout(timeoutId);
            const isTimeout = err.name === 'AbortError';
            console.warn(isTimeout ? "Cloud fetch timed out, keeping cached data" : "Cloud fetch failed, falling back to local cache", err);
            showSyncBanner(isTimeout ? new Error('TIMEOUT') : err);
            if (!hadCache) ordersData = loadCachedOrders();
        }
    }

    function showSyncBanner(err) {
        const banner = document.getElementById('syncBanner');
        const detail = document.getElementById('syncDetail');
        const icon = document.getElementById('syncIcon');
        const mainText = document.getElementById('syncMainText');
        if (!banner) return;
        const msg = err.message || String(err);
        const isLikelyCors = err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(msg);
        const isEmptyBody = msg === 'EMPTY_BODY';
        const isTimeout = msg === 'TIMEOUT';
        const isRefreshing = msg === 'REFRESHING_CACHE';

        banner.classList.remove('info', 'warn', 'error');
        if (isRefreshing) {
            banner.classList.add('info');
            icon.textContent = '🔄';
            mainText.textContent = 'Loaded your last synced data — refreshing from Power Automate in the background.';
            detail.innerText = '';
            banner.classList.add('show');
            return;
        }
        banner.classList.add('warn');
        icon.textContent = '⚠️';
        mainText.textContent = 'Showing locally cached data — live sync with Power Automate failed.';
        if (isTimeout) {
            detail.innerText = "(The flow took too long to respond — showing your last synced data instead.)";
        } else if (isLikelyCors) {
            detail.innerText = "(Likely a CORS issue — the flow needs an Access-Control-Allow-Origin response header. See console for details.)";
        } else if (isEmptyBody) {
            detail.innerText = "(The flow responded with an empty body — it needs a 'Response' action at the end that returns the orders array as JSON.)";
        } else {
            detail.innerText = `(${msg})`;
        }
        banner.classList.add('show');
    }

    function hideSyncBanner() {
        const banner = document.getElementById('syncBanner');
        if (banner) banner.classList.remove('show');
    }

    function renderGrid() {
        const tbody = document.querySelector('#queueTable tbody');
        tbody.innerHTML = '';

        const counts = { Draft: 0, Submitted: 0, Approved: 0, Rejected: 0 };

        ordersData.forEach((order, index) => {
            const header = order["Sales Order"];
            let status = header["Status"] || "Submitted";
            if (counts[status] !== undefined) counts[status]++;

            let statusClass = "status-submitted";
            if (status === "Draft") statusClass = "status-draft";
            if (status === "Approved") statusClass = "status-approved";
            if (status === "Rejected") statusClass = "status-rejected";

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="uid-badge">${header["UID"] || '-'}</span></td>
                <td>
                    <div style="font-weight: 600; color: #0f172a; margin-bottom: 4px;">${header["Customer Name"] || '-'}</div>
                    <div style="font-size: 12px; color: #64748b;">${header["Location"] || '-'}</div>
                </td>
                <td>
                    <div style="font-weight: 500; margin-bottom: 4px;">${orderTypeLabel(header["Order Type to mention"]) || '-'}</div>
                    <div style="font-size: 12px; color: #64748b;">BOQ: ${header["BOQ / Product details"] ? header["BOQ / Product details"].substring(0,20)+'...' : 'N/A'}</div>
                </td>
                <td style="font-weight: 600;">₹ ${header["Price bifurcation / PO Amount"] || '0.00'}</td>
                <td style="color: #475569;">${header["Sales Person Name"] || '-'}</td>
                <td>
                    <select class="status-select ${statusClass}" onchange="updateStatus(${index}, this.value)">
                        <option value="Draft" ${status === 'Draft' ? 'selected' : ''}>Draft</option>
                        <option value="Submitted" ${status === 'Submitted' ? 'selected' : ''}>Pending Review</option>
                        <option value="Approved" ${status === 'Approved' ? 'selected' : ''}>Approved</option>
                        <option value="Rejected" ${status === 'Rejected' ? 'selected' : ''}>Rejected / Fix</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('statsBar').innerHTML = `
            <div class="stat-item">Pending Review <span style="background:#e4eaff; color:#173e9e;">${counts.Submitted}</span></div>
            <div class="stat-item">Approved <span style="background:#dcf7e3; color:#15803d;">${counts.Approved}</span></div>
            <div class="stat-item">Needs Fix <span style="background:#fbd9d9; color:#9f1d1d;">${counts.Rejected}</span></div>
            <div class="stat-item">Drafts <span>${counts.Draft}</span></div>
        `;
    }

    function updateStatus(index, newStatus) {
        ordersData[index]["Sales Order"]["Status"] = newStatus;
        localStorage.setItem('crmOrders', JSON.stringify(ordersData));
        renderGrid(); 
        
        if(powerAutomateUpdateUrl) {
            fetch(powerAutomateUpdateUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ordersData[index])
            }).catch(e => console.error("Cloud status sync failed", e));
        }
    }

    window.onload = async function() {
        if (!sessionStorage.getItem('loggedInUser')) { window.location.href = 'login.html'; return; }
        if (!enforcePageAccess()) return;
        applySidebarAccess();
        await loadOrders();
        renderGrid();
    };
</script>
<script src="utils.js"></script>
</body>
