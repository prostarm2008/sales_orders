<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0; }
        .logo-container { margin-bottom: 24px; }
        .logo-container img { height: 40px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: 600; font-size: 13px; color: #475569; margin-bottom: 6px; display: block; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-login { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-login:hover { background: #1d4ed8; }
        .demo-text { margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <img src="Prostarm-logo.png" alt="Prostarm CRM" onerror="this.outerHTML='<h2 style=\'color:#2563eb; margin:0;\'>PROSTARM</h2>';">
    </div>
    <h2 style="margin-top: 0; font-size: 20px; color: #0f172a;">Sign in to CRM</h2>
    
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@prostarm.com">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <button class="btn-login" onclick="login()">Sign In</button>
    <div class="demo-text">Use any email/password to log into the demo.</div>
</div>

<script>
    function formatName(str) {
        if (!str) return "User";
        if (str.includes('@')) str = str.split('@')[0];
        return str.split('.').map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
    }

    function login() {
        const email = document.getElementById('email').value.trim();
        if(email) {
            const formattedName = formatName(email);
            sessionStorage.setItem('loggedInUser', formattedName);
            sessionStorage.setItem('loggedInEmail', email);
            window.location.href = 'dashboard.html';
        } else {
            alert("Please enter an email address.");
        }
    }
    
    document.getElementById("password").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            login();
        }
    });
</script>
<script src="utils.js"></script>
</body>
</html>
