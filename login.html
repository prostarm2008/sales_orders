<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prostarm CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;background:var(--ink)}
.login-shell{display:grid;grid-template-columns:1.1fr 1fr;width:100%;max-width:920px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}
.brand-panel{background:linear-gradient(160deg,#0c1a2b 0%,#14406a 55%,#0f766e 100%);padding:48px 40px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:460px}
.brand-panel::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 8%,rgba(245,158,11,.4) 0,transparent 42%),repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 26px)}
.brand-panel .logo-chip{background:#fff;border-radius:var(--radius-md);padding:10px 16px;display:inline-flex;width:fit-content;position:relative}
.brand-panel .logo-chip img{height:26px;display:block}
.brand-copy{position:relative;margin-top:32px}
.brand-copy h1{font-size:30px;line-height:1.2;margin:0 0 14px;font-weight:800}
.brand-copy p{font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.82);margin:0;max-width:330px}
.power-tag{position:relative;margin-top:auto;padding-top:28px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.75)}
.power-dot{width:8px;height:8px;border-radius:50%;background:var(--power);animation:dotPulse 2.4s var(--ease) infinite}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}70%{box-shadow:0 0 0 9px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.form-panel{padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.form-panel h2{margin:0 0 6px;font-size:24px}
.form-panel .subhead{margin:0 0 26px;font-size:14px;color:var(--text-muted)}
.form-group{margin-bottom:18px}
.form-group label{font-weight:700;font-size:13px;color:#475569;margin-bottom:6px;display:block}
.form-group input{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.btn-login{width:100%;background:var(--primary-grad);color:#fff;border:none;padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;box-shadow:var(--shadow-glow);transition:transform .2s var(--ease)}
.btn-login:hover{transform:translateY(-2px)}
.btn-login:disabled{opacity:.7;cursor:wait;transform:none}
.demo-text{margin-top:20px;font-size:12px;color:var(--text-faint);text-align:center}
@media(max-width:720px){.login-shell{grid-template-columns:1fr}.brand-panel{min-height:0;padding:32px}}
</style>
</head>
<body>

<div class="login-shell">
    <div class="brand-panel">
        <div class="logo-chip">
            <img src="Prostarm-logo.png" alt="Prostarm" onerror="this.parentElement.outerHTML='<div style=\'font-weight:800; font-size:20px; color:#1e4fd6;\'>PROSTARM</div>';">
        </div>
        <div class="brand-copy">
            <h1>Power Redefined,<br>now for your pipeline.</h1>
            <p>Sign in to manage onboarding, orders and dispatch across your sales network from one place.</p>
        </div>
        <div class="power-tag"><span class="power-dot"></span> Prostarm CRM</div>
    </div>

    <div class="form-panel">
        <h2>Sign in to CRM</h2>
        <p class="subhead">Enter your username to continue.</p>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="email" autocomplete="username" placeholder="e.g. rahul.sharma">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="loginError" style="display:none; background:var(--danger-light); color:#9f1d1d; border:1px solid #f6c6c6; border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:14px;"></div>

        <button class="btn-login" id="loginBtn" onclick="login()">Sign In</button>
        <div class="demo-text" id="demoText">Sign in with the username and password issued to you.</div>
    </div>
</div>

<script>
    // formatName() is provided by utils.js (loaded at the bottom of this page)

    // Point this at your "CRM - Verify Login" flow's HTTP trigger URL (see the
    // build notes shared alongside this file). Until you fill this in, login
    // will show a clear setup error instead of silently failing.
    const powerAutomateLoginUrl = "https://8549b42c711be8948675eefb5cf215.dd.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/0c6c032f16bd43e2bf49b9b4f04328cf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GHi2R79sfcZcrajsa-Ke9QyEMOXNaAGvN7qJEITS6yA";

    function showLoginError(msg) {
        const box = document.getElementById('loginError');
        box.textContent = msg;
        box.style.display = 'block';
    }

    function hideLoginError() {
        document.getElementById('loginError').style.display = 'none';
    }

    async function login() {
        hideLoginError();
        const username = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showLoginError('Please enter both username and password.');
            return;
        }

        if (!powerAutomateLoginUrl || powerAutomateLoginUrl.startsWith('PASTE_')) {
            showLoginError('Login isn\'t configured yet — the app is missing its login verification flow URL.');
            console.error('powerAutomateLoginUrl is still a placeholder. See build notes for the "CRM - Verify Login" flow.');
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerText = 'Signing in...';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000); // 20s cap

        try {
            const response = await fetch(powerAutomateLoginUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();

            if (!result || result.success !== true) {
                showLoginError('Invalid username or password.');
                btn.disabled = false;
                btn.innerText = 'Sign In';
                return;
            }

            const level = String(result.level || 'User').trim();
            const fullName = String(result.fullName || '').trim() || formatName(username);
            const emailAddr = String(result.email || '').trim();

            sessionStorage.setItem('loggedInUser', fullName);
            sessionStorage.setItem('loggedInEmail', emailAddr);
            sessionStorage.setItem('userLevel', level);
            window.location.href = 'dashboard.html';
        } catch (err) {
            clearTimeout(timeoutId);
            const isTimeout = err.name === 'AbortError';
            console.error('Login failed', err);
            showLoginError(isTimeout
                ? 'Login timed out. Please try again.'
                : 'Could not verify your credentials right now. Please try again in a moment.');
            btn.disabled = false;
            btn.innerText = 'Sign In';
        }
    }

    document.getElementById("password").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            login();
        }
    });
</script>
<script src="utils.js"></script>
</body>
</html>
